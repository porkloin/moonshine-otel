[package]
name = "moonshine-otel"
description = "Records Moonshine's streams from its statistics socket, with OTLP export and regression comparison"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "moonshine-otel"
path = "src/main.rs"

[features]
default = []
# Sample GPU utilization/memory through NVML (proprietary Nvidia driver only).
nvml = ["dep:nvml-wrapper"]

[dependencies]
moonshine-otel-exporter.workspace = true
anyhow.workspace = true
clap.workspace = true
gethostname.workspace = true
libc = "0.2"
opentelemetry.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
nvml-wrapper = { version = "0.13.0", optional = true }
serde.workspace = true
csv.workspace = true
resvg = { version = "0.45", default-features = false, features = ["text"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
