apiVersion: 1

providers:
  - name: moonshine-otel
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      # A folder per directory: Moonshine/ holds moonshine-otel's; others (a test harness's) sit beside it.
      foldersFromFilesStructure: true
